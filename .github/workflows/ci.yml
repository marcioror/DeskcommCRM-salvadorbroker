name: ci

# ⚠️ SEM `push: branches: [main]` NESTE FORK — decisão do dono do produto em
# 2026-09-07, e ela é de CONTA, não de engenharia.
#
# O upstream roda esta bateria duas vezes por entrega: uma no PR e outra no push
# de `main` depois do merge. Na casa dele isso é barato — repositório PÚBLICO,
# Actions ilimitado. Aqui o repositório é PRIVADO: 2.000 min/mês, e a cota já
# esgotou uma vez (2026-08-26).
#
# Medido em 2026-09-07, no dia da sincronização com a v1.16.1: 1.564 dos 2.000
# minutos consumidos em UM dia. Por rodada completa: `e2e` ~65 min (roda em duas
# partes paralelas, e cada uma é cobrada), `ci` ~19, publicação de imagem ~6,5,
# `perf` ~4. Rodar tudo de novo no merge dobrava o custo de cada entrega.
#
# ⚠️ O QUE SE PERDE, ESCRITO PARA NÃO SER DESCOBERTO DEPOIS: o `pull_request`
# testa `refs/pull/N/merge`, que É o resultado da junção — então o merge não
# entra sem ter sido testado. O buraco é outro e é estreito: se um SEGUNDO PR
# entrar depois de o primeiro mudar a `main`, o segundo pode ter sido medido
# contra uma base já vencida. Vale a pena aqui porque o repositório tem um
# operador só e os PRs entram um de cada vez; num time com merges concorrentes,
# não valeria.
#
# ⚠️ A PUBLICAÇÃO DE IMAGEM NÃO ENTRA NESTE CORTE, e não é esquecimento:
# `publish-image.yml` CONTINUA disparando em push de `main`, porque é ele que
# publica a tag `latest` que o `.env` da VPS puxa. Cortá-lo faria o site parar
# de receber atualização — economia que quebra o produto não é economia.
on:
  pull_request:

# O GITHUB_TOKEN destes jobs serve a `actions/checkout` (clone) e a
# `actions/setup-node` (manifest de `actions/node-versions`, repo público) —
# `contents: read` cobre os dois, que é o escopo que o próprio modelo de dados do
# CodeQL prescreve para essas duas actions. O `cache: pnpm` NÃO usa este token
# (usa ACTIONS_RUNTIME_TOKEN), `pnpm/action-setup` não tem input de token, e
# nenhum passo `run:` enxerga o token — ele só entra no ambiente via
# `secrets.GITHUB_TOKEN`, que não aparece em nenhum destes workflows.
#
# No topo, e não por job, porque os dois jobs precisam do mesmo escopo e job
# acrescentado depois nasce restrito em vez de herdar o default do repositório.
# Esse default hoje é `read` (medido em actions/permissions/workflow), então isto
# não corrige vazamento em vigor: tira a garantia de uma configuração que muda
# fora do repo, num clique, sem PR e sem deixar rastro aqui. `packages: write`
# continua por job em publish-image.yml — mesma regra, menor escopo que precisa.
concurrency:
  # RODADA SUPERADA É CANCELADA — em PR, e só em PR.
  #
  # Sem isto, cada push numa branch com PR aberto deixa a rodada anterior
  # correndo até o fim contra um commit que ninguém mais vai olhar. Não é
  # hipótese: numa única sessão de sincronização com o upstream (2026-09-07)
  # dois `e2e` completos ficaram órfãos assim, ~25 min de runner cada. E este
  # repositório é PRIVADO — 2.000 min/mês —, com a cota já esgotada uma vez
  # (2026-08-26), quando job que não conseguia iniciar aparecia como `failure`
  # com zero passos e parecia defeito do commit.
  #
  # `github.ref` já separa os grupos sozinho: em PR ele é `refs/pull/N/merge`,
  # num push de `main` é `refs/heads/main`. Duas PRs não se cancelam, e o push
  # de `main` nunca cai no mesmo grupo que uma PR.
  #
  # ⚠️ `cancel-in-progress` é EXPRESSÃO, e não `true`, de propósito. Em push de
  # `main` (e de tag) o cancelamento fica DESLIGADO: é de lá que sai a imagem
  # publicada e o histórico dos checks obrigatórios. Cancelar uma publicação
  # pela metade porque outro merge entrou logo atrás é trocar minuto de CI por
  # imagem que não existe.
  #
  # ⚠️ E ISTO ACRESCENTA UM SENTIDO NOVO A "cancelled". O Actions já usava a
  # mesma palavra para teto de tempo batido e para cancelamento de verdade —
  # o que já mentiu numa triagem aqui. Agora há um terceiro: rodada superada.
  # Como distinguir, sem adivinhar: se o `headSha` da rodada NÃO é mais o topo
  # da branch, ela foi superada por um push seu e não há o que investigar.
  #
  #   gh run list -R <repo> --branch <branch> --json headSha,conclusion,createdAt
  #   git rev-parse <branch>
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    # 25, e não os 15 do upstream: os arquivos de teste do fork (proteção de
    # contato, imóveis) somam ~390s só de montar `environment`, e a suíte
    # inteira levou 750s no run 32962605518 — que o teto de 15 cortou DEPOIS
    # de ela terminar, reportando "cancelled" no lugar das 4 falhas reais.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/preparar-node
        # O teto do preâmbulo mora aqui porque passo de composite action não
        # aceita `timeout-minutes`. Razão e medições: o cabeçalho da action.
        timeout-minutes: 5

      # O `tsc` desta árvore encosta no teto de heap padrão do Node: passou em
      # 77s no run 32962605518 e MORREU em 92s no 32967326531, com o mesmo
      # código de produto (o commit no meio só mexeu em e2e.yml). Ou seja, não
      # é regressão — é sorte de GC. O runner tem 16 GB; 6 GB de heap tira o
      # limite do caminho sem esconder crescimento real.
      - name: Typecheck
        run: pnpm typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=6144

      - name: Lint
        run: pnpm lint

      # Invariante 1 de docs/doctrine/restricao-de-canal.md: nenhuma feature
      # nomeia um provider. Step próprio (e não só dentro de `gov:verify`)
      # porque é o CI que gateia PR — `gov:verify` não é invocado por nenhum
      # workflow, e mecanismo que não roda no gate não protege nada.
      - name: Channel provider leak
        run: pnpm lint:channels

      - name: Unit tests
        run: pnpm test:unit


      # Scripts do kit self-host num repo git descartável (docker/crontab
      # dublados). É o único gate que exercita o update.sh — um erro aqui
      # rebobina a instalação de quem hospeda, e nenhum teste TS o veria.
      #
      # Desde 2026-08-08 inclui `hostgator-setup-kit/test-validators.sh`, os 163
      # casos que cobrem o install.sh. Eles existiam e NÃO rodavam em job nenhum
      # (issue #191): dois defeitos que tornavam a instalação impossível —
      # escolher OpenRouter travava o instalador num laço, escolher OpenAI
      # deixava o .env pela metade — passaram por todos os checks verdes. 15s.
      - name: Kit self-host (bash)
        run: pnpm test:shell

  # Gate de isolamento multi-tenant + invariantes de governança.
  # Job separado de propósito: roda em paralelo ao verify (não atrasa o feedback
  # rápido) e vira um check nomeado, que é o que a doutrina de RLS exige provar.
  # scripts/test-db.sh sobe pgvector/pgvector:pg17, aplica supabase/baseline.sql
  # em modo install (ON_ERROR_STOP=1) e update (idempotência), e roda
  # tests/invariants/** contra ele. Invocar via `pnpm test:db` é o que põe
  # node_modules/.bin no PATH que o script herda para chamar `vitest`.
  invariants:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/preparar-node
        # O teto do preâmbulo mora aqui porque passo de composite action não
        # aceita `timeout-minutes`. Razão e medições: o cabeçalho da action.
        timeout-minutes: 5

      - name: RLS isolation + governance invariants
        run: pnpm test:db

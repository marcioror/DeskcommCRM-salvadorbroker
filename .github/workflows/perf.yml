name: perf

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# O GITHUB_TOKEN deste job serve a `actions/checkout` (clone) e a
# `actions/setup-node` (manifest de `actions/node-versions`, repo público).
# `pnpm build` é local e o relatório de tamanho é escrita em arquivo do runner
# (`>> $GITHUB_STEP_SUMMARY`), sem token. Ver o comentário em ci.yml para o
# porquê de o bloco ficar no topo.
concurrency:
  # RODADA SUPERADA É CANCELADA — em PR, e só em PR.
  #
  # Sem isto, cada push numa branch com PR aberto deixa a rodada anterior
  # correndo até o fim contra um commit que ninguém mais vai olhar. Não é
  # hipótese: numa única sessão de sincronização com o upstream (2026-09-07)
  # dois `e2e` completos ficaram órfãos assim, ~25 min de runner cada. E este
  # repositório é PRIVADO — 2.000 min/mês —, com a cota já esgotada uma vez
  # (2026-08-26), quando job que não conseguia iniciar aparecia como `failure`
  # com zero passos e parecia defeito do commit.
  #
  # `github.ref` já separa os grupos sozinho: em PR ele é `refs/pull/N/merge`,
  # num push de `main` é `refs/heads/main`. Duas PRs não se cancelam, e o push
  # de `main` nunca cai no mesmo grupo que uma PR.
  #
  # ⚠️ `cancel-in-progress` é EXPRESSÃO, e não `true`, de propósito. Em push de
  # `main` (e de tag) o cancelamento fica DESLIGADO: é de lá que sai a imagem
  # publicada e o histórico dos checks obrigatórios. Cancelar uma publicação
  # pela metade porque outro merge entrou logo atrás é trocar minuto de CI por
  # imagem que não existe.
  #
  # ⚠️ E ISTO ACRESCENTA UM SENTIDO NOVO A "cancelled". O Actions já usava a
  # mesma palavra para teto de tempo batido e para cancelamento de verdade —
  # o que já mentiu numa triagem aqui. Agora há um terceiro: rodada superada.
  # Como distinguir, sem adivinhar: se o `headSha` da rodada NÃO é mais o topo
  # da branch, ela foi superada por um push seu e não há o que investigar.
  #
  #   gh run list -R <repo> --branch <branch> --json headSha,conclusion,createdAt
  #   git rev-parse <branch>
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build-and-size:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/preparar-node
        # O teto do preâmbulo mora aqui porque passo de composite action não
        # aceita `timeout-minutes`. Razão e medições: o cabeçalho da action.
        timeout-minutes: 5

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          # "off", não vazio: vazio seleciona o Sentry DA COMUNIDADE
          # (lib/sentry/dsn.ts:8-10). A intenção aqui sempre foi desligar, e
          # com aspas vazias ela não era alcançada — o build seguia com o DSN
          # padrão embutido.
          SENTRY_DSN: "off"

      - name: Report bundle sizes
        run: |
          {
            echo "## Build output sizes"
            du -sh .next 2>/dev/null || true
            if [ -d .next/static ]; then du -sh .next/static; fi
          } >> "$GITHUB_STEP_SUMMARY"

      # NOTE: Lighthouse CI + bundle-analyzer thresholds deferred (S-12.05 follow-up).
